<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Дерево целей К-Скай 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style id="page-style">
/* Layout: L0 bar → 4 columns of company goals (headers aligned via subgrid); each column stacks vectors with function goals */
:root{
  --bg:#FFFFFF; --fg:#242525; --muted:#7F8185; --line:#CED2DA;
  --head-bg:#242525; --head-fg:#FFFFFF; --accent:#F2F84C; --accent-fg:#242525;
  --font:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#242525; --fg:#FFFFFF; --muted:#CED2DA; --line:#7F8185; --head-bg:#FFFFFF; --head-fg:#242525; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242525; --fg:#FFFFFF; --muted:#CED2DA; --line:#7F8185; --head-bg:#FFFFFF; --head-fg:#242525; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:12px;line-height:1.35}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1 mark{background:var(--accent);color:var(--accent-fg);padding:0 .25em}
.meta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar[hidden]{display:none}
button{font:inherit;font-size:11.5px;font-weight:700;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg);padding:5px 12px;cursor:pointer}
button.primary{background:var(--fg);color:var(--bg)}
button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{color:var(--muted);font-size:11px}

.l0{border:1.5px solid var(--fg);padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lvl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.l0 b{font-size:13px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:auto;gap:12px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}

.goal{display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:8px;min-width:0}
.goal-h{background:var(--head-bg);color:var(--head-fg);padding:9px 11px 10px;display:flex;flex-direction:column;gap:3px;align-self:stretch}
.goal-h .n{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.goal-h h2{margin:0;font-size:15px;font-weight:800}
.goal-h p{margin:0;font-size:10.5px;opacity:.85}
.goal-b{display:flex;flex-direction:column;gap:8px;min-width:0}

.vec{border:1px solid var(--line);background:var(--bg);padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px}
.vec h3{margin:0;font-size:11.5px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.vec h3 .code{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px;align-items:baseline}
.fn{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;min-width:0;overflow-wrap:normal}
.t{min-width:0}
.new{background:var(--accent);color:var(--accent-fg);font-size:9px;font-weight:700;padding:0 4px;margin-left:3px;white-space:nowrap}
.shared{font-weight:700;margin-left:3px}
li.contrib .t{color:var(--muted);font-style:italic}
li.lead .t{color:var(--muted)}
.sub{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}

.del,.add{display:none}
.editing [contenteditable="true"]{outline:1px dashed var(--line);outline-offset:1px;cursor:text}
.editing .goal-h [contenteditable="true"]{outline-color:var(--muted)}
.editing .del{display:inline-block;border:0;background:none;color:var(--muted);padding:0 2px;font-size:13px;line-height:1}
.editing .add{display:inline-block;align-self:flex-start;border:1px dashed var(--muted);color:var(--muted);padding:2px 8px;font-size:10.5px}

footer{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:10.5px;border-top:1px solid var(--line);padding-top:10px}
footer span{display:inline-flex;gap:5px;align-items:baseline}
li.has-k{cursor:pointer}
li.has-k:hover .tt{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.caret{border:0;background:none;padding:0 3px;color:var(--muted);font-size:10px;line-height:1;cursor:pointer;transition:transform .15s}
li.open > .caret{transform:rotate(90deg);color:var(--fg)}
@media (prefers-reduced-motion: reduce){.caret{transition:none}}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lvl{margin-right:2px}
.chip{font-size:10.5px;font-weight:600;padding:3px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.chip .c{color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .c{color:var(--bg);opacity:.7}
.chip.reset{border-style:dashed;color:var(--muted)}
.empty{color:var(--muted);font-size:11px;padding:6px 2px}
ul.kpi{grid-column:2 / -1;gap:3px;margin:2px 0 4px;padding-left:8px;border-left:2px solid var(--line)}
ul.kpi li{grid-template-columns:14px minmax(0,1fr) auto;font-size:10.5px;cursor:default}
.ky{font-size:9.5px;font-weight:800;color:var(--muted)}
.draft{border:1px solid var(--muted);color:var(--muted);font-size:9px;font-weight:700;padding:0 3px;margin-left:3px;white-space:nowrap}
.views{display:flex;gap:0;border-bottom:1px solid var(--line)}
.views button{border:0;border-bottom:3px solid transparent;padding:9px 18px;font-size:14px;background:transparent}
.views button[aria-current="page"]{border-bottom-color:var(--fg)}
.initiative-intro{font-size:14px;color:var(--muted);margin:4px 0}
.initiative-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.initiative-goal{border:1px solid var(--line);min-width:0}
.initiative-goal-head{background:var(--head-bg);color:var(--head-fg);padding:12px 14px}
.initiative-goal-head .meta{color:var(--head-fg);opacity:.75;font-size:12px}
.initiative-goal-head h2{font-size:16px;margin:5px 0 0;line-height:1.35}
.initiative-list{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.initiative-card{border-bottom:1px solid var(--line);padding-bottom:10px;font-size:14px}
.initiative-card:last-child{border-bottom:0;padding-bottom:0}
.initiative-card h3{font-size:15px;line-height:1.35;margin:0 0 5px}
.initiative-card p{margin:5px 0;line-height:1.45}
.initiative-card .meta{font-size:12px;line-height:1.45}
.initiative-card .label{font-weight:700}
.initiative-status{display:inline-block;border:1px solid var(--line);padding:2px 6px;font-size:12px;margin-bottom:7px}
.initiative-empty{font-size:13px;color:var(--muted);margin:0}
.initiative-edit [contenteditable="true"]{outline:1px dashed var(--muted);outline-offset:2px;min-height:1em}
.initiative-edit [contenteditable="true"]:empty::before{content:attr(data-placeholder);color:var(--muted)}
.initiative-edit .add,.initiative-edit .del{display:inline-block}
.initiative-edit .del{margin-top:6px;font-size:12px}
.initiative-edit select{font:inherit;font-size:13px;padding:4px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
@media(max-width:720px){.initiative-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

<script>
/* Адрес веб-приложения Apps Script (таблица «К-Скай_Дерево целей 2027 (данные сайта)»). Ключ правки на сайте не хранится: он приходит в ссылке ?key=… */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBDNTtkJZHRnnaSTI7uSXxX7R77L61_bGbkHOGfIOulFYp1fwnU3mZl--NL-mzyhy5/exec';
(function(){
  var embedded = JSON.parse(document.getElementById('tree-data').textContent);
  var initiativeEmbedded = JSON.parse(document.getElementById('initiative-data').textContent);
  var saved = embedded, state = clone(embedded);
  var base = null, editing = false, busy = false, dirty = false;
  var initiativeSaved = clone(initiativeEmbedded.items), initiativeState = clone(initiativeEmbedded.items);
  var initiativeBase = null, initiativeReady = false, initiativeEditing = false, initiativeDirty = false;
  /* Ключ правки: из ссылки ?key=…; один раз открытый — запоминается в этом браузере */
  var key = new URLSearchParams(location.search).get('key') || '';
  try{ if(key) localStorage.setItem('ksky-celi-key', key); else key = localStorage.getItem('ksky-celi-key') || ''; }catch(e){}
  var canEdit = !!(key && SCRIPT_URL);
  var root = document.getElementById('root');
  var note = '';
  var openSet = {};
  var NAMES = {'КД':'Коммерция','РП':'Реализация и РП','Вн':'Внедрение','Разр':'Разработка','ИИ':'ИИ','Прод':'Продукт','Инфра':'Инфраструктура','ИБ':'ИБ','МедЭ':'Медэкспертиза','Юр':'Юристы','Фин':'Финансы','HR':'HR','СМК':'СМК','Марк':'Маркетинг'};
  var params = new URLSearchParams(location.search);
  var view = params.get('view') === 'initiatives' ? 'initiatives' : 'goals';
  var filter = {};
  (params.get('f')||'').split(',').filter(String).forEach(function(f){filter[f]=true;});
  function filterOn(){return Object.keys(filter).length>0;}
  function visible(it){return editing || !filterOn() || !!filter[it.fn];}
  function fnList(){
    var cnt={}, order=Object.keys(NAMES);
    eachItem(function(it){ if(!it.kind) cnt[it.fn]=(cnt[it.fn]||0)+1; });
    var list=order.filter(function(f){return cnt[f];});
    Object.keys(cnt).forEach(function(f){ if(list.indexOf(f)<0) list.push(f); });
    return list.map(function(f){return {fn:f,n:cnt[f]};});
  }
  function syncUrl(){
    var p=new URLSearchParams(location.search), f=Object.keys(filter).join(',');
    if(f) p.set('f',f); else p['delete']('f');
    if(view==='initiatives') p.set('view','initiatives'); else p['delete']('view');
    var q=p.toString().replace(/%2C/g,',');
    try{ history.replaceState(null,'',location.pathname+(q?'?'+q:'')); }catch(e){}
  }
  function openFiltered(){
    openSet={};
    if(filterOn()) eachItem(function(it,p){ if(!it.kind && filter[it.fn] && it.kpi && it.kpi.length) openSet[p]=true; });
  }

  function clone(o){return JSON.parse(JSON.stringify(o));}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ed(path, text, tag, cls){
    tag = tag || 'span';
    return '<'+tag+(cls?' class="'+cls+'"':'')+' data-path="'+path+'"'+(editing?' contenteditable="true" spellcheck="false"':'')+'>'+esc(text)+'</'+tag+'>';
  }
  function getPath(p){return p.split('.').reduce(function(o,k){return o[k];},state);}
  function setPath(p,v){var ks=p.split('.'),last=ks.pop();ks.reduce(function(o,k){return o[k];},state)[last]=v;}
  function eachItem(fn){
    state.goals.forEach(function(g,gi){g.vectors.forEach(function(v,vi){v.items.forEach(function(it,ii){fn(it,'goals.'+gi+'.vectors.'+vi+'.items.'+ii);});});});
  }
  function kpiPaths(){var a=[];eachItem(function(it,p){if(it.kpi&&it.kpi.length)a.push(p);});return a;}
  function allOpen(){var a=kpiPaths();return a.length>0&&a.every(function(p){return openSet[p];});}
  function counts(){
    var v=0,g=0,k=0;
    if(filterOn() && !editing){
      state.goals.forEach(function(goal){goal.vectors.forEach(function(vec){var hit=false;vec.items.forEach(function(it){if(!it.kind&&filter[it.fn]){g++;hit=true;k+=(it.kpi||[]).length;}});if(hit)v++;});});
      function pl(n,a,b,c){var m=n%10,mm=n%100;return n+' '+(m===1&&mm!==11?a:(m>=2&&m<=4&&(mm<12||mm>14)?b:c));}
      return 'выбрано: '+pl(g,'цель','цели','целей')+' · '+pl(v,'вектор','вектора','векторов')+' · '+k+' KPI';
    }
    state.goals.forEach(function(goal){goal.vectors.forEach(function(vec){v++;vec.items.forEach(function(it){if(!it.kind)g++;k+=(it.kpi||[]).length;});});});
    return state.goals.length+' цели · '+v+' векторов · '+g+' целей функций · '+k+' KPI';
  }

  function item(it, path){
    var isGoal = !it.kind, hasK = isGoal && it.kpi && it.kpi.length;
    var open = isGoal && (editing || (hasK && openSet[path]));
    var cls = (it.kind||'') + (hasK && !editing ? ' has-k' : '') + (open && hasK ? ' open' : '');
    var h = '<li class="'+cls+'" data-item="'+path+'">'+ed(path+'.fn',it.fn,'span','fn')+
      '<span class="t">'+ed(path+'.t',it.t,'span','tt')+(it.shared?'<span class="shared" title="Общая метрика КД и РП">⇄</span>':'')+(it['new']?'<span class="new">новое</span>':'')+(it.draft?'<span class="draft" title="KPI предложены JTBD, нужно подтверждение">черновик KPI</span>':'')+'</span>';
    if(editing) h += '<button class="del" data-act="del" data-path="'+path+'" aria-label="Удалить цель">×</button>';
    else if(hasK) h += '<button class="caret" data-act="toggle" data-path="'+path+'" aria-expanded="'+(open?'true':'false')+'" aria-label="Показать KPI">▸</button>';
    else h += '<span></span>';
    if(open){
      h += '<ul class="kpi">';
      (it.kpi||[]).forEach(function(k,ki){
        var kp = path+'.kpi.'+ki;
        h += '<li>'+ed(kp+'.y',k.y,'span','ky')+ed(kp+'.n',k.n,'span','kn')+(editing?'<button class="del" data-act="del" data-path="'+kp+'" aria-label="Удалить KPI">×</button>':'<span></span>')+'</li>';
      });
      if(editing) h += '<li class="kadd"><span></span><button class="add" data-act="addk" data-path="'+path+'">+ KPI</button><span></span></li>';
      h += '</ul>';
    }
    return h + '</li>';
  }

  function viewsHtml(){
    return '<nav class="views" aria-label="Разделы"><button data-act="view" data-view="goals" aria-current="'+(view==='goals'?'page':'false')+'">Цели</button><button data-act="view" data-view="initiatives" aria-current="'+(view==='initiatives'?'page':'false')+'">Инициативы</button></nav>';
  }
  function filtersHtml(single){
    var h='<div class="filters" role="group" aria-label="Выбор отдела"><span class="lvl">Отдел</span>';
    fnList().forEach(function(x){h+='<button class="chip" data-act="fn" data-fn="'+esc(x.fn)+'" aria-pressed="'+(filter[x.fn]?'true':'false')+'" title="'+esc(NAMES[x.fn]||x.fn)+'">'+esc(NAMES[x.fn]||x.fn)+'<span class="c">'+x.n+'</span></button>';});
    if(filterOn()) h+='<button class="chip reset" data-act="fn-reset">'+(single?'Выбрать другой отдел':'Все функции')+'</button>';
    return h+'</div>';
  }
  function initText(index,key,placeholder){
    var value=initiativeState[index][key]||'';
    if(!initiativeEditing) return esc(value||'—');
    return '<span contenteditable="true" spellcheck="false" role="textbox" aria-label="'+esc(placeholder)+'" data-init-index="'+index+'" data-init-field="'+key+'" data-placeholder="'+esc(placeholder)+'">'+esc(value)+'</span>';
  }
  function initiativeCard(it,index){
    var statuses=['Обсуждалась','На согласовании','Согласована','В работе','Завершена'];
    var h='<article class="initiative-card"><span class="initiative-status">'+(initiativeEditing?'<select data-init-status="'+index+'" aria-label="Статус инициативы">'+statuses.map(function(s){return '<option'+(it.status===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>':esc(it.status||'Без статуса'))+'</span>';
    h+='<h3>'+initText(index,'title','Название инициативы')+'</h3>';
    h+='<p><span class="label">Результат:</span> '+initText(index,'result','Ожидаемый результат')+'</p>';
    h+='<div class="meta"><span class="label">Срок:</span> '+initText(index,'due','Указать срок')+' · <span class="label">Ответственный:</span> '+initText(index,'owner','Указать ответственного')+'</div>';
    if(it.note||initiativeEditing) h+='<p class="meta"><span class="label">Примечание:</span> '+initText(index,'note','Добавить примечание')+'</p>';
    if(initiativeEditing) h+='<button class="del" data-act="init-del" data-index="'+index+'" aria-label="Удалить инициативу">Удалить инициативу</button>';
    return h+'</article>';
  }
  function renderInitiatives(){
    var selected=Object.keys(filter)[0]||'', goals=0, shown=0;
    var h='<header><h1>К-Скай · <mark>инициативы 2027</mark></h1><div class="meta">проект для обсуждения · данные по целям от '+esc(state.updated)+'</div></header>'+viewsHtml();
    h+='<div class="bar">';
    if(canEdit&&initiativeReady&&!initiativeEditing&&selected) h+='<button id="i-edit">Редактировать инициативы</button>';
    if(initiativeEditing) h+='<button class="primary" id="i-save">Сохранить для всех</button><button id="i-cancel">Отменить</button><span class="status">Измените поля под целью или добавьте инициативу.</span>';
    h+='<span class="status" id="msg">'+esc(note)+'</span></div>';
    if(!initiativeEditing) h+=filtersHtml(true);
    if(!selected){h+='<p class="initiative-intro">Выберите отдел: появятся его цели и инициативы для их достижения.</p>';}
    else {
      h+='<p class="initiative-intro">'+esc(NAMES[selected]||selected)+' · инициативы привязаны к целям отдела. Статус «Обсуждалась» означает, что решение ещё не утверждено.</p>';
      h+='<div class="initiative-grid">';
      state.goals.forEach(function(g){g.vectors.forEach(function(v){v.items.forEach(function(it){
        if(it.kind||it.fn!==selected) return;
        goals++;
        var indices=[];initiativeState.forEach(function(x,i){if(x.fn===selected&&x.code===v.code&&x.goal===it.t)indices.push(i);});
        shown+=indices.length;
        h+='<section class="initiative-goal"><div class="initiative-goal-head"><span class="meta">'+esc(v.code)+' · '+esc(v.title)+'</span><h2>'+esc(it.t)+'</h2></div><div class="initiative-list">';
        if(indices.length) indices.forEach(function(i){h+=initiativeCard(initiativeState[i],i);});
        else h+='<p class="initiative-empty">Инициативы предстоит добавить</p>';
        if(initiativeEditing) h+='<button class="add" data-act="init-add" data-fn="'+esc(selected)+'" data-code="'+esc(v.code)+'" data-goal="'+esc(it.t)+'">+ Инициатива</button>';
        h+='</div></section>';
      });});});
      h+='</div><footer>'+goals+' целей отдела · '+shown+' инициатив. Данные инициатив хранятся отдельно от KPI.</footer>';
    }
    root.innerHTML=h;
    root.classList.toggle('initiative-edit',initiativeEditing);
    root.classList.remove('editing');
  }
  function render(){
    if(view==='initiatives'){renderInitiatives();return;}
    var h = '';
    h += '<header><h1>К-Скай · <mark>дерево целей 2027</mark></h1><div class="meta">проект для обсуждения · '+counts()+' · обновлено '+esc(state.updated)+'</div></header>';
    h += viewsHtml();
    h += '<div class="bar">';
    if(!editing && kpiPaths().length) h += '<button id="b-all" aria-pressed="'+(allOpen()?'true':'false')+'">'+(allOpen()?'Свернуть все KPI':'Раскрыть все KPI')+'</button>';
    if(canEdit && !editing) h += '<button id="b-edit">Редактировать</button>';
    if(editing) h += '<button class="primary" id="b-save">Сохранить для всех</button><button id="b-cancel">Отменить</button><span class="status">Нажмите на текст, чтобы изменить. «+ цель» и «+ KPI» добавляют строку, × удаляет. Тип KPI: Р или О.</span>';
    h += '<span class="status" id="msg">'+esc(note)+'</span></div>';
    if(!editing){
      h += filtersHtml(false);
    }
    h += '<div class="l0"><span class="lvl">L0 · видение</span><b>'+ed('l0.title',state.l0.title)+'</b>'+ed('l0.sub',state.l0.sub,'span','meta')+'</div>';
    h += '<div class="grid">';
    state.goals.forEach(function(goal,gi){
      var gp='goals.'+gi;
      h += '<section class="goal"><div class="goal-h"><span class="n">L1 · цель '+(gi+1)+'</span>'+ed(gp+'.title',goal.title,'h2')+ed(gp+'.metric',goal.metric,'p')+'</div><div class="goal-b">';
      var shown=0;
      goal.vectors.forEach(function(vec,vi){
        var vp=gp+'.vectors.'+vi, main='', contrib='';
        vec.items.forEach(function(it,ii){ if(!visible(it)) return; var s=item(it,vp+'.items.'+ii); if(it.kind==='contrib') contrib+=s; else main+=s; });
        if(!editing && filterOn() && !main && !contrib) return;
        shown++;
        h += '<div class="vec"><h3><span class="code">'+esc(vec.code)+'</span>'+ed(vp+'.title',vec.title)+'</h3><ul>'+main+'</ul>';
        if(contrib) h += '<div class="sub">вклады функций</div><ul>'+contrib+'</ul>';
        h += '<button class="add" data-act="add" data-path="'+vp+'">+ цель</button></div>';
      });
      if(!shown) h += '<div class="empty">У выбранных функций нет целей в этом блоке</div>';
      h += '</div></section>';
    });
    h += '</div>';
    h += '<footer><span>▸ нажмите на цель, чтобы раскрыть её KPI</span><span><b>Р</b> — результирующий KPI · <b>О</b> — опережающий</span><span><b>⇄</b> общая метрика КД и РП: доля сделок, принятых РП без возврата</span><span><span class="new">новое</span> добавлено в этой версии</span><span><span class="draft">черновик KPI</span> KPI предложены JTBD, нужно подтверждение</span><span><i>курсив</i> — метрика-вклад, не отдельная цель</span><span>КД — коммерческий департамент · Вн — внедрение и поддержка · Разр — разработка · Инфра — инфраструктура · МедЭ — медэкспертиза · Юр — юридическая функция</span></footer>';
    root.innerHTML = h;
    root.classList.toggle('editing', editing);
    root.classList.remove('initiative-edit');
  }
  function msg(t){note=t; var m=document.getElementById('msg'); if(m) m.textContent=t;}

  root.addEventListener('input', function(e){
    var initEl=e.target.closest('[data-init-field]');
    if(initEl&&initEl.isContentEditable){initiativeState[+initEl.dataset.initIndex][initEl.dataset.initField]=initEl.textContent.replace(/\s+/g,' ').trim();initiativeDirty=true;return;}
    var el = e.target.closest('[data-path]');
    if(el && el.isContentEditable){ setPath(el.dataset.path, el.textContent.replace(/\s+/g,' ').trim()); dirty=true; }
  });
  root.addEventListener('change',function(e){
    if(e.target.matches('[data-init-status]')){initiativeState[+e.target.dataset.initStatus].status=e.target.value;initiativeDirty=true;}
  });
  root.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.isContentEditable){ e.preventDefault(); e.target.blur(); }
  });
  root.addEventListener('paste', function(e){
    if(!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' '));
  });
  root.addEventListener('click', function(e){
    if(busy) return;
    var b = e.target.closest('button');
    var act=b&&b.dataset.act;
    if(act==='view'){
      if((editing&&dirty)||(initiativeEditing&&initiativeDirty)){msg('Сначала сохраните или отмените изменения.');return;}
      editing=false;initiativeEditing=false;view=b.dataset.view;
      if(view==='initiatives'&&Object.keys(filter).length>1){var first=Object.keys(filter)[0];filter={};filter[first]=true;}
      note='';syncUrl();render();return;
    }
    if(view==='initiatives'){
      if(!b)return;
      if(b.id==='i-edit'){initiativeEditing=true;note='';render();return;}
      if(b.id==='i-cancel'){initiativeState=clone(initiativeSaved);initiativeEditing=false;initiativeDirty=false;note='';render();return;}
      if(b.id==='i-save'){saveInitiatives();return;}
      if(act==='fn'){filter={};filter[b.dataset.fn]=true;syncUrl();render();return;}
      if(act==='fn-reset'){filter={};syncUrl();render();return;}
      if(act==='init-del'){initiativeState.splice(+b.dataset.index,1);initiativeDirty=true;render();return;}
      if(act==='init-add'){
        var n=initiativeState.reduce(function(max,it){var m=String(it.id||'').match(/\d+$/);return Math.max(max,m?+m[0]:0);},0)+1;
        initiativeState.push({id:'И-'+String(n).padStart(3,'0'),fn:b.dataset.fn,code:b.dataset.code,goal:b.dataset.goal,title:'Новая инициатива',result:'',due:'',owner:'',status:'На согласовании',note:''});
        initiativeDirty=true;render();return;
      }
      return;
    }
    if(!b){
      if(editing || e.target.closest('.kpi')) return;
      var li = e.target.closest('li.has-k');
      if(li){ var p=li.dataset.item; openSet[p]=!openSet[p]; render(); }
      return;
    }
    if(b.id==='b-all'){ var on=!allOpen(); openSet={}; if(on) kpiPaths().forEach(function(p){openSet[p]=true;}); render(); return; }
    if(b.id==='b-edit'){ editing=true; note=''; render(); return; }
    if(b.id==='b-cancel'){ state=clone(saved); editing=false; dirty=false; note=''; render(); return; }
    if(b.id==='b-save'){ save(); return; }
    var path=b.dataset.path;
    if(act==='fn'){ var f=b.dataset.fn; if(filter[f]) delete filter[f]; else filter[f]=true; openFiltered(); syncUrl(); render(); return; }
    if(act==='fn-reset'){ filter={}; openSet={}; syncUrl(); render(); return; }
    if(act==='toggle'){ openSet[path]=!openSet[path]; render(); return; }
    if(act==='del'){ var ks=path.split('.'), idx=+ks.pop(); getPath(ks.join('.')).splice(idx,1); dirty=true; render(); return; }
    if(act==='add'){ getPath(path).items.push({fn:'Функция',t:'Новая цель',kpi:[]}); dirty=true; render(); return; }
    if(act==='addk'){ var it=getPath(path); (it.kpi=it.kpi||[]).push({y:'Р',n:'Новый KPI'}); dirty=true; render(); return; }
  });
  window.addEventListener('beforeunload', function(e){ if((editing&&dirty)||(initiativeEditing&&initiativeDirty)){ e.preventDefault(); e.returnValue=''; } });

  /* Таблица без KPI (заполнена до появления колонки или колонка пустая): KPI берём из встроенной версии по совпадению вектора, функции и формулировки */
  function mergeKpi(tree){
    var map={};
    embedded.goals.forEach(function(g){g.vectors.forEach(function(v){v.items.forEach(function(it){map[v.code+'|'+it.fn+'|'+it.t]=it;});});});
    tree.goals.forEach(function(g){g.vectors.forEach(function(v){v.items.forEach(function(it){
      var src=map[v.code+'|'+it.fn+'|'+it.t];
      if(src){ if(src.kpi) it.kpi=clone(src.kpi); if(src.draft) it.draft=true; }
    });});});
  }
  function apply(data){
    if(data&&data.initiatives&&Array.isArray(data.initiatives.items)){
      initiativeSaved=clone(data.initiatives.items);initiativeState=clone(initiativeSaved);
      initiativeBase=data.initiatives.stamp;initiativeReady=true;
    }
    if(data && !data.empty && data.tree && data.tree.goals){
      var kc=0; data.tree.goals.forEach(function(g){g.vectors.forEach(function(v){v.items.forEach(function(it){kc+=(it.kpi||[]).length;});});});
      if(!data.kpiColumn || kc===0) mergeKpi(data.tree);
      saved = data.tree; state = clone(saved); base = data.stamp; openFiltered();
    }
  }
  function load(){
    if(!SCRIPT_URL){ render(); return; }
    fetch(SCRIPT_URL, {cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      apply(data); if(!editing) render();
    }).catch(function(){ msg('Таблица недоступна, показана версия от '+embedded.updated+'.'); });
  }
  function save(){
    busy=true; msg('Сохраняю…');
    fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key:key, base:base, tree:state})})
      .then(function(r){return r.json();})
      .then(function(res){
        busy=false;
        if(res.ok){ apply(res.data); editing=false; dirty=false; note='Сохранено. Правки видят все, кто откроет ссылку.'; render(); return; }
        if(res.error==='conflict'){ apply(res.data); editing=false; dirty=false; note='Пока вы правили, кто-то сохранил свою версию. Показана она — внесите правку ещё раз.'; render(); return; }
        if(res.error==='bad_key'){ try{localStorage.removeItem('ksky-celi-key');}catch(e){} canEdit=false; editing=false; note='Эта ссылка только для просмотра. Правки не сохранены.'; render(); return; }
        msg('Не сохранилось. Попробуйте ещё раз через минуту.');
      })
      .catch(function(){ busy=false; msg('Нет связи с таблицей. Правки на странице, попробуйте сохранить ещё раз.'); });
  }
  function saveInitiatives(){
    if(!initiativeReady){msg('Сервис инициатив ещё не доступен.');return;}
    if(initiativeState.some(function(it){return !it.title.trim();})){msg('Укажите название каждой инициативы.');return;}
    busy=true;msg('Сохраняю инициативы…');
    fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kind:'initiatives',key:key,base:initiativeBase,initiatives:initiativeState})})
      .then(function(r){return r.json();})
      .then(function(res){
        busy=false;
        if(res.ok&&res.data&&Array.isArray(res.data.items)){
          initiativeSaved=clone(res.data.items);initiativeState=clone(initiativeSaved);initiativeBase=res.data.stamp;
          initiativeEditing=false;initiativeDirty=false;note='Сохранено. Инициативы видят все, кто откроет ссылку.';render();return;
        }
        if(res.error==='conflict'&&res.data){initiativeSaved=clone(res.data.items);initiativeState=clone(initiativeSaved);initiativeBase=res.data.stamp;initiativeEditing=false;initiativeDirty=false;note='Кто-то сохранил изменения раньше вас. Показана новая версия.';render();return;}
        if(res.error==='bad_key'){canEdit=false;initiativeEditing=false;note='Нет доступа к сохранению.';render();return;}
        msg('Не удалось сохранить инициативы. Проверьте данные и попробуйте ещё раз.');
      })
      .catch(function(){busy=false;msg('Нет связи с таблицей. Попробуйте сохранить ещё раз.');});
  }

  openFiltered();
  render();
  load();
})();
</script>
